[project]
name = "vocaloid6-mcp"
version = "0.1.0"
description = "MCP server that lets Claude operate VOCALOID6 and write VOCALOID3-6 projects (English / Japanese)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "psutil>=5.9",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
kanji = ["pykakasi>=2.2"]
test = ["lxml>=5", "mido>=1.3"]

[project.scripts]
vocaloid6-mcp = "vocaloid6_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocaloid6_mcp"]
